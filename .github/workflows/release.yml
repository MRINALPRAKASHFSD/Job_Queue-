name: Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Cross-Platform Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Extract Tag Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building release for ${TAG}"

      - name: Compile Cross-Platform Binaries
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p dist
          PLATFORMS=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            OUTPUT_NAME="reliable-job-engine_${TAG}_${GOOS}_${GOARCH}"
            ARCHIVE_DIR="dist/${OUTPUT_NAME}"
            mkdir -p "${ARCHIVE_DIR}"

            echo "Building ${OUTPUT_NAME}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X 'github.com/MRINALPRAKASHFSD/reliable-job-engine/internal/config.Version=${TAG}'" \
              -o "${ARCHIVE_DIR}/server${EXT}" ./cmd/server

            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X 'github.com/MRINALPRAKASHFSD/reliable-job-engine/internal/config.Version=${TAG}'" \
              -o "${ARCHIVE_DIR}/worker${EXT}" ./cmd/worker

            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X 'github.com/MRINALPRAKASHFSD/reliable-job-engine/internal/config.Version=${TAG}'" \
              -o "${ARCHIVE_DIR}/jobctl${EXT}" ./cmd/cli

            cp LICENSE NOTICE README.md "${ARCHIVE_DIR}/"

            tar -czf "dist/${OUTPUT_NAME}.tar.gz" -C dist "${OUTPUT_NAME}"
            rm -rf "${ARCHIVE_DIR}"
          done

          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          draft: true
          prerelease: false
          generate_release_notes: true
          name: Release ${{ steps.vars.outputs.tag }}
          tag_name: ${{ steps.vars.outputs.tag }}
