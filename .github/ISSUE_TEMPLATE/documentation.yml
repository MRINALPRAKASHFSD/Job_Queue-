name: Documentation Improvement
description: Suggest improvements or corrections to README, ARCHITECTURE, or guides.
title: "docs(<scope>): <short description>"
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Accurate, clear documentation is vital for distributed systems software. Thank you for helping improve our docs!
  - type: input
    id: location
    attributes:
      label: Documentation File or Section
      placeholder: "e.g., ARCHITECTURE.md (Section 4: Fencing Tokens)"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
      description: What is currently unclear, incomplete, or out of date?
    validations:
      required: true
  - type: textarea
    id: suggested_changes
    attributes:
      label: Suggested Changes
      description: Proposed wording, diagrams, or technical clarifications.
    validations:
      required: true
