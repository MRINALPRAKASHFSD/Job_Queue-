name: Bug Report
description: Report an issue, concurrency defect, or unexpected behavior in reliable-job-engine.
title: "fix(<scope>): <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you are not reporting a security vulnerability here.
        For vulnerabilities, please refer to [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe the problem, unexpected state transition, or failed lock behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps, Go code, or SQL script to reproduce the issue.
      placeholder: |
        1. Enqueue job with payload ...
        2. Worker starts with lease timeout ...
        3. Force worker kill or connection drop ...
        4. Observe unexpected state ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened based on the architecture specification?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Go version, PostgreSQL version, OS architecture.
      placeholder: "Go 1.24, PostgreSQL 16.2, macOS Darwin arm64 / Linux x86_64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Stack Traces
      description: Please paste sanitized logs (remove sensitive credentials or tokens).
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have verified that no sensitive credentials or private data are included in this report.
          required: true
