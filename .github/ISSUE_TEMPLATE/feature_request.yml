name: Feature Request
description: Propose an architectural enhancement, driver support, or new capability.
title: "feat(<scope>): <short proposal description>"
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to reliable-job-engine!
        Please review [ROADMAP.md](../../ROADMAP.md) and [ARCHITECTURE.md](../../ARCHITECTURE.md) to ensure alignment with our distributed design goals.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific operational challenge or bottleneck?
      placeholder: Describe the distributed systems problem or operational need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / API Design
      description: Describe your proposed architectural approach, Go API changes, or schema additions.
      placeholder: Detailed description of the feature and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds did you consider?
  - type: textarea
    id: guarantees
    attributes:
      label: Reliability and Concurrency Impact
      description: How does this feature impact ACID guarantees, lease safety, and worker crash recovery?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution Readiness
      options:
        - label: I am willing to submit a pull request implementing this feature if approved.
